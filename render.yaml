services:
  - type: web
    name: lifeclip
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifeclip-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: lifeclip
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: RETENTION_DAYS
        value: 90

databases:
  - name: lifeclip-db
    plan: free
    databaseName: lifeclip
    user: lifeclip
